[package]
name = "sendspin-sender"
version = "0.1.0"
edition = "2021"
description = "Sendspin source@v1 client: streams a PipeWire virtual sink to a Sendspin server"
license = "MIT"

[[bin]]
name = "sendspin-sender"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
data-encoding = "2"
futures-util = "0.3"
libc = "0.2"
mdns-sd = "0.13"
pipewire = { version = "0.10", features = ["v0_3_44"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snow = "0.10"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
